[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiotwin-hf"
version = "0.1.0"
description = "Synthetic-data personalized heart-failure digital twin prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyYAML>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["cardiotwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
